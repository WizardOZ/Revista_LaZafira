
        <section class="formulario-container">
            <h2>Datos del Autor</h2>
            <!-- Crear una tabla para contener el formulario -->
            <form action="https://formspree.io/f/myzkdqrp" method="POST">
                <!-- Datos del autor -->
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required />
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" required />
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required />
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" required />
                </div>

                <!-- Título -->
                <div class="form-group">
                    <label for="titulo">Título (Obra Gráfica, Portada o Texto Crítico):</label>
                    <input type="text" id="titulo" name="titulo" required />
                </div>

                <!-- Subir archivo de texto crítico -->
                <div class="form-group">
                    <label for="archivo_texto">Archivo (Enlace)*:</label>
                    <input type="url" id="archivo_texto" name="archivo_texto" required />
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios adicionales:</label>
                    <textarea id="comentarios" name="comentarios" placeholder="Escribe aquí ..."></textarea>
                </div>
                <input type="hidden" id="tipo" name="tipo" />
                <!-- Botón de envío -->
                <button type="submit" class="form-button">Enviar Texto Crítico</button>
            </form>
            <p>
                    * Cualquier sistema de almacenamientos en nube como 'Google Drive', 'One Drive', 'Mega',...</br>
                    Todas son válidas para compartir sus trabajos con nosotros.
            </p>
        </section>
